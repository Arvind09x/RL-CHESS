# Round-2 training settings, read by train-round2.sbatch. Decided by Arvind, 19 Oct 2026 ~12:35 IST, before the
# job ran (amendment to round-2 plan decision 3): self-play draws weighted 20% round-1 / 80% round-2 for BOTH
# recipes, so mix and pure draw identical self-play sequences and differ only in the 8 Stockfish rows; the budget
# is the smallest N giving one full pass over the round-2 training positions at that share (no round-2 reuse;
# about 23% of round-1 positions get a second pass). Legacy uniform one pass over the union would have been
# N = ceil((N1 + N2) / 24) with round 2 at ~48% of draws.
R2_SAMPLING_MODE=weighted
R2_UPDATES=auto
R2_MIX_WEIGHTS="0.20 0.80"
R2_PURE_WEIGHTS="0.20 0.80"

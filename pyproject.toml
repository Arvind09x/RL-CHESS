[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "chess-rl"
version = "0.1.0"
description = "Shared CPU chess adapter for the RL-Chess project"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.5.3",
    "python-chess==1.999",
    "chess==1.11.2",
]

[project.optional-dependencies]
model = ["torch==2.8.0"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/chess_rl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["cuda: requires one real visible NVIDIA GPU"]

# Keep optional model installs CPU-only on Linux/Windows; macOS arm64 uses PyPI.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
